<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grok Bot">

<title>Grok Bot</title>
<style>
:root{
  --bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--fg:#fff;
  --fg2:rgba(235,235,245,.6);--fg3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.55);
  --green:#00d35a;--red:#ff453a;--orange:#ff9f0a;--cyan:#64d2ff;--blue:#0a84ff;--yellow:#ffd60a;--pink:#ff6b9a;
  --display:-apple-system,"SF Pro Display",system-ui,sans-serif;
  --text:-apple-system,"SF Pro Text",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.35 var(--text);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
input,select{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.screen{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 8px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 96px) max(16px,env(safe-area-inset-left,0px))}
.screen[hidden]{display:none}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.sec{color:var(--fg2)} .ter{color:var(--fg3)}
.small{font-size:13px} .mono{font-family:var(--mono)}
.green{color:var(--green)} .red{color:var(--red)} .orange{color:var(--orange)} .cyan{color:var(--cyan)} .blue{color:var(--blue)} .yellow{color:var(--yellow)} .pink{color:var(--pink)}
h2{font:600 20px/1.2 var(--display);margin:8px 0 0}
.sectionhead{display:flex;align-items:baseline;justify-content:space-between;margin-top:8px}
.sectionhead h2{margin:0}
.link{color:var(--blue);min-height:44px;display:inline-flex;align-items:center}

/* navbar */
.nav{display:flex;align-items:center;gap:8px;min-height:52px}
.nav .title{font:600 17px var(--text);display:flex;align-items:center;gap:4px;min-height:44px}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:22px;position:relative}
.iconbtn svg{width:24px;height:24px;stroke:var(--fg);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.avatar{width:32px;height:32px;border-radius:16px;background:var(--card2);display:grid;place-items:center;font:600 14px var(--text)}
.dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:5px;background:var(--green);border:2px solid var(--bg)}
.errorrow{background:rgba(255,69,58,.14);color:var(--red);border-radius:10px;padding:10px 12px;font-size:13px}

/* balance */
.balance{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.odo{font:700 clamp(54px,17vw,88px)/1 var(--display);letter-spacing:-.02em;display:inline-flex;overflow:hidden;height:1em}
.odo .d{display:inline-block;height:1em;overflow:hidden;position:relative}
.odo .col{display:flex;flex-direction:column;transition:transform 600ms cubic-bezier(.2,.8,.2,1)}
.odo .col span{height:1em;line-height:1em;display:block;text-align:center}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;font:600 13px var(--text)}
.pill.paper{background:var(--orange);color:#000;margin-top:8px}
.pill.mult{background:rgba(0,211,90,.16);color:var(--green)}
.pill.mono{font:500 12px var(--mono)}
.pill.redp{background:rgba(255,69,58,.16);color:var(--red)} .pill.greenp{background:rgba(0,211,90,.16);color:var(--green)}
.today{display:flex;align-items:center;gap:10px;font:500 17px var(--text)}

/* chart */
.chartwrap{position:relative;height:220px;margin:0 -16px}
.chartwrap canvas{width:100%;height:100%;display:block}
.chartempty{position:absolute;inset:0;display:grid;place-items:center;color:var(--fg2);font-size:14px}
.ranges{display:flex;justify-content:space-between}
.ranges button{min-width:44px;min-height:36px;border-radius:18px;font:600 13px var(--text);color:var(--fg2)}
.ranges button[aria-pressed="true"]{background:var(--card2);color:var(--fg)}

/* agent cards */
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.acard{flex:0 0 calc(100vw - 32px);max-width:100%;aspect-ratio:504/470;background:var(--card);border-radius:calc((100vw - 32px) * 42 / 504);padding:20px;scroll-snap-align:center;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.acard .head{display:flex;align-items:center;justify-content:space-between}
.acard .name{font:600 15px var(--text)}
.acard .big{font:700 34px/1.05 var(--display)}
.feed{display:flex;flex-direction:column;gap:6px;font-size:13px;overflow:hidden;flex:1}
.feed .f{display:flex;gap:8px;justify-content:space-between}
.feed .f .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed .kill .n{color:var(--fg3);text-decoration:line-through;text-decoration-color:var(--red)}
.feed .kill .r{color:var(--red);white-space:nowrap}
.strips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.strips i{height:28px;border-radius:7px;background:var(--card2);display:block;transition:background 150ms}
.strips i.ok{background:var(--green)} .strips i.bad{background:var(--red)} .strips i.run{background:var(--cyan)}
.ring{width:130px;height:130px;align-self:center}
.bar{height:8px;border-radius:4px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);width:0;transition:width 1.2s linear}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.empty{color:var(--fg2);font-size:14px;display:grid;place-items:center;flex:1;text-align:center}

/* lists */
.list{background:var(--card);border-radius:14px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:60px;width:100%;text-align:left}
.li+.li{border-top:.5px solid var(--sep)}
.li .ic{width:36px;height:36px;border-radius:18px;display:grid;place-items:center;flex:none;font:700 14px var(--text)}
.ic.bought{background:rgba(10,132,255,.18);color:var(--blue)} .ic.sold{background:rgba(0,211,90,.18);color:var(--green)}
.ic.stopped{background:rgba(255,69,58,.18);color:var(--red)} .ic.rejected{background:var(--card2);color:var(--fg2)}
.li .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:13px;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .v{text-align:right;font-weight:500;white-space:nowrap}

/* agents tab */
.agentfull{background:var(--card);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.status{width:9px;height:9px;border-radius:5px;background:var(--green);display:inline-block}
.status.off{background:var(--fg3)}
.switch{width:51px;height:31px;border-radius:16px;background:var(--card2);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:14px;background:#fff;transition:transform .2s}
.switch[aria-checked="true"]{background:var(--green)} .switch[aria-checked="true"]::after{transform:translateX(20px)}
.switch:disabled{opacity:.4}
.switchwrap{min-width:51px;min-height:44px;display:grid;place-items:center}
.dec{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;font-size:13px}
.dec a{color:var(--fg)} .dec .r{color:var(--fg2);text-align:right}

/* account */
.group{background:var(--card);border-radius:14px;overflow:hidden}
.gl{font-size:13px;color:var(--fg2);margin:8px 0 -8px 16px}
.set{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.set+.set{border-top:.5px solid var(--sep)}
.set .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.set input[type=range]{width:100%;accent-color:var(--blue);height:32px}
.set input[type=number],.set input[type=text],.set input[type=password],.set select,.cmd input{background:var(--card2);border:0;border-radius:10px;min-height:44px;padding:0 12px;width:100%}
.set input[type=number]{width:120px;text-align:right}
.seg{display:flex;background:var(--card2);border-radius:9px;padding:2px}
.seg button{flex:1;min-height:36px;border-radius:7px;font:600 14px var(--text);color:var(--fg2)}
.seg button[aria-pressed="true"]{background:#636366;color:#fff}
.seg button:disabled{opacity:.4}
.err{color:var(--red);font-size:13px}
.btn{min-height:50px;border-radius:14px;background:var(--blue);color:#fff;font:600 17px var(--text);display:flex;align-items:center;justify-content:center;width:100%}
.btn.buy{background:var(--green);color:#000} .btn.sell{background:var(--red)} .btn.grey{background:var(--card2);color:var(--fg)}
.cmd{display:flex;gap:8px} .cmd button{min-width:72px;border-radius:10px;background:var(--blue);color:#fff;font-weight:600}
.cmdout{font:13px/1.45 var(--mono);color:var(--fg2);white-space:pre-wrap;overflow-wrap:anywhere}
.cmdout a{color:var(--blue)}

/* sheets */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 8px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px));transform:translateY(0);transition:transform .25s ease}
.sheet[hidden]{display:none}
.sheet .close{font:600 17px var(--text);color:var(--blue);min-height:44px;min-width:44px}
.coinhead{display:flex;flex-direction:column;gap:2px}
.coinhead .nm{font:700 28px/1.1 var(--display);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.shield{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:12px;background:rgba(0,211,90,.16);color:var(--green);font:600 13px var(--text)}
.shield.bad{background:rgba(255,69,58,.16);color:var(--red)}
.price{font:700 44px/1.05 var(--display)}
.candlewrap{height:240px;margin:0 -16px;position:relative}
.candlewrap canvas{width:100%;height:100%;display:block}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--sep);border-radius:14px;overflow:hidden}
.stats div{background:var(--card);padding:12px 16px}
.stats b{display:block;font:600 17px var(--text);margin-top:2px}
.card{background:var(--card);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.kv span:first-child{color:var(--fg2)}

/* auditor screen */
.discs{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0;position:relative}
.disc{width:min(260px,70vw);height:34px;border-radius:50%;background:var(--card2);position:relative;transition:background 150ms;display:grid;place-items:center;font:700 15px var(--text);color:transparent}
.disc.ok{background:var(--green);color:#000} .disc.bad{background:var(--red);color:#fff} .disc.skip{background:#3a3a3c}
.disc.beam{box-shadow:0 0 0 2px var(--cyan) inset}
.layerrows .li{min-height:52px}
.verdictbig{font:700 22px/1.2 var(--display)}

/* toast */
.toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:60;display:flex;flex-direction:column;gap:8px;padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.toast{pointer-events:auto;background:rgba(44,44,46,.96);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.toast .hd{font-size:12px;color:var(--fg2);display:flex;justify-content:space-between}
.toast .tx{font-weight:600;white-space:pre-line}
.toast .acts{display:flex;gap:8px}
.toast .acts a,.toast .acts button{flex:1;min-height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:600;background:#3a3a3c}
.toast .acts a.buy{background:var(--green);color:#000} .toast .acts a.sell{background:var(--red);color:#fff}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 4px) max(8px,env(safe-area-inset-left,0px));background:rgba(22,22,24,.78);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep)}
.tabbar button{min-width:64px;min-height:48px;display:flex;flex-direction:column;align-items:center;gap:2px;font:500 10px var(--text);color:var(--fg3)}
.tabbar button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-selected="true"]{color:var(--fg)}

/* loading */
.skel{background:var(--card);border-radius:12px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .odo .col,.bar i,.disc,.strips i{transition:none!important}
  .skel{animation:none}
}

</style>

<body>
<script>
// ===== core.js · pure logic, no DOM. Tested in node (tests/test_core.js). =====

// ---- links.py equivalent: THE ONLY place FOMO URLs are built ----
const CHAIN_ID = { solana: 1399811149, robinhood: 4663, base: 8453, bnb: 56 };
const SIGNUP_URL = "https://fomo.family/r/savipww";
function coin_url(address, chain = "solana") {
  if (!(chain in CHAIN_ID)) { console.warn("coin_url: unknown chain", chain); return SIGNUP_URL; }
  return `https://fomo.family/coin?address=${address}&chainId=${CHAIN_ID[chain]}&r=savipww&source=share_link`;
}
function profile_url(handle) {
  const h = String(handle || "").replace(/^@+/, "");
  return `https://fomo.family/profile/${h}?source=share_link&r=savipww`;
}

// ---- settings (STEP 10) with ranges ----
const SETTINGS_SPEC = {
  scanner: {
    min_liquidity_usd: [40000, 1000, 1000000, "Min liquidity $"],
    max_top10_pct: [25, 1, 100, "Max top 10 %"],
    max_h1_change_pct: [80, 1, 1000, "Max 1h change %"],
    poll_s: [60, 15, 600, "Poll every s"],
    min_pool_age_min: [10, 0, 120, "Min pool age min"],
    max_wait_min: [60, 5, 360, "Max wait min"],
    runner_h24_pct: [300, 50, 5000, "Runner 24h %"],
  },
  auditor: {
    enabled: [true, null, null, "Take apart before buying"],
    max_dev_pct: [5, 0, 100, "Max dev %"],
    max_top10_pct: [25, 1, 100, "Max top 10 %"],
    min_lp_locked_pct: [99, 0, 100, "Min LP locked %"],
    min_pool_age_min: [10, 0, 120, "Min pool age min"],
    max_bundled: [5, 1, 100, "Max bundled wallets"],
    max_delegated_accounts: [10, 1, 1000, "Max accounts per delegate"],
    retries: [3, 0, 10, "Retries"],
  },
  analyst: {
    mode: ["rules", null, null, "Mode"],
    min_alive_6h: [0.70, 0, 1, "Min alive 6h"],
    min_organic: [0.65, 0, 1, "Min organic"],
    max_chase: [0.30, 0, 1, "Max chase"],
    min_score: [70, 0, 100, "Min score"],
    timeout_s: [10, 2, 60, "Timeout s"],
    alive_volume_h1: [25000, 100, 10000000, "Rules · alive at 1h volume $"],
    organic_buys_h1: [150, 1, 100000, "Rules · organic at 1h buys"],
    bundled_penalty: [0.5, 0, 1, "Rules · bundled penalty ×"],
    bundled_from: [3, 1, 100, "Rules · penalty from wallets"],
    flush_drop_m5_pct: [5, 0.5, 90, "Rules · flush drop 5m %"],
    chase_h1_pct: [80, 1, 1000, "Rules · chase at 1h %"],
  },
  executor: {
    stack_pct: [8, 0.5, 100, "Stack %"],
    max_pool_pct: [2, 0.1, 50, "Max % of pool"],
    min_ticket_usd: [47.50, 5, 10000, "Min ticket $"],
    below_min: ["bump", null, null, "Below min"],
    recheck_liq_drop_pct: [20, 1, 100, "Recheck liq drop %"],
    recheck_price_up_pct: [15, 1, 500, "Recheck price up %"],
    confirm_window_min: [5, 1, 60, "Confirm window min"],
  },
  risk: {
    poll_s: [15, 5, 120, "Poll every s"],
    stop_pct: [6, 0.5, 90, "Stop %"],
    trail_start_pct: [20, 1, 1000, "Trail starts at +%"],
    trail_pct: [12, 0.5, 90, "Trail %"],
    timeout_h: [3, 0.25, 48, "Timeout h"],
    timeout_min_gain_pct: [5, 0, 1000, "Timeout min gain %"],
    confirm_window_min: [2, 1, 60, "Confirm window min"],
  },
  desk: {
    mode: ["PAPER", null, null, "Mode"],
    paper_start_stack: [200, 10, 1000000, "PAPER start stack $"],
    rpc_url: ["", null, null, "Solana RPC URL"],
    push_rejects: [false, null, null, "Alert on rejects"],
    fees_ref_discount: [0.10, 0, 1, "Ref fee discount"],
    fomo_handle: ["Scappy123", null, null, "FOMO handle"],
  },
};
const SETTING_ALIASES = { stop: "risk.stop_pct", trail: "risk.trail_pct", stack: "executor.stack_pct", timeout: "risk.timeout_h" };

function defaultSettings() {
  const s = {};
  for (const [g, keys] of Object.entries(SETTINGS_SPEC)) { s[g] = {}; for (const [k, v] of Object.entries(keys)) s[g][k] = v[0]; }
  return s;
}
// returns {ok, value, error}
function validateSetting(group, key, value) {
  const spec = SETTINGS_SPEC[group]?.[key];
  if (!spec) return { ok: false, error: "unknown setting " + group + "." + key };
  const [def, min, max] = spec;
  if (typeof def === "boolean") return { ok: true, value: value === true || value === "true" };
  if (key === "below_min") return ["bump", "skip"].includes(value) ? { ok: true, value } : { ok: false, error: "bump or skip" };
  if (group === "analyst" && key === "mode") return ["rules", "jev"].includes(value) ? { ok: true, value } : { ok: false, error: "rules or jev" };
  if (group === "desk" && key === "mode") return ["PAPER", "LIVE"].includes(value) ? { ok: true, value } : { ok: false, error: "PAPER or LIVE" };
  if (typeof def === "string") return { ok: true, value: String(value).trim() };
  const n = Number(value);
  if (!isFinite(n)) return { ok: false, error: "not a number" };
  if (n < min || n > max) return { ok: false, error: `range ${min} to ${max}` };
  return { ok: true, value: n };
}

// ---- fees.py: FOMO on Solana, per side, minus ref discount ----
function fomoFee(ticketUsd, refDiscount = 0.10) {
  const t = Math.abs(ticketUsd);
  let f;
  if (t <= 47.50) f = t * 0.02;
  else if (t <= 190) f = 0.95;
  else f = t * 0.005;
  return round2(f * (1 - refDiscount));
}

// ---- ticket check (STEP 10) ----
function ticketCheck(stack, ex) {
  const minStack = ex.min_ticket_usd / (ex.stack_pct / 100);
  if (stack >= minStack) return { status: "ok", minStack };
  if (ex.below_min === "bump") return { status: "bump", minStack, msg: `tickets bumped to $${fmt2(ex.min_ticket_usd)} = ${fmt1(100 * ex.min_ticket_usd / stack)}% of stack` };
  return { status: "skip", minStack, msg: `every coin will be skipped, stack under $${fmt2(minStack)}` };
}

// ---- Executor sizing ----
// returns {size, cap, skip:reason|null}
function sizeTicket({ stack, openUsd, poolLiqUsd, ex }) {
  const free = stack - openUsd;
  let size = stack * ex.stack_pct / 100, cap = "stack_pct";
  const poolCap = poolLiqUsd * ex.max_pool_pct / 100;
  if (poolCap < size) { size = poolCap; cap = "pool"; }
  if (size < ex.min_ticket_usd) {
    if (ex.below_min === "skip") return { size: round2(size), cap, skip: "under $" + fmt2(ex.min_ticket_usd) };
    size = ex.min_ticket_usd; cap = "bump";
  }
  if (size > free) return { size: round2(size), cap, skip: "no free stack" };
  return { size: round2(size), cap, skip: null };
}

// ---- Analyst rules mode ----
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
function rulesAnswers(dex, bundled, an) {
  const vh1 = num(dex?.volume?.h1), bh1 = num(dex?.txns?.h1?.buys);
  const pm5 = num(dex?.priceChange?.m5), ph1 = num(dex?.priceChange?.h1);
  const bm5 = num(dex?.txns?.m5?.buys), sm5 = num(dex?.txns?.m5?.sells);
  let organic = clamp(bh1 / an.organic_buys_h1, 0, 1);
  if ((bundled || 0) >= an.bundled_from) organic *= an.bundled_penalty;
  const flush = (pm5 <= -an.flush_drop_m5_pct && bm5 >= sm5) ? 1 : (pm5 < 0 ? 0.5 : 0);
  return {
    alive_6h: round3(clamp(vh1 / an.alive_volume_h1, 0, 1)),

// GATE (code only)
function gate(a, an) {

    if (typeof a[k] !== "number" || !(a[k] >= 0 && a[k] <= 1)) return { score: null, passed: false, failed: ["bad answer"] };
  }
  const score = Math.round(100 * (a.alive_6h + a.organic + a.flush + (1 - a.chase)) / 4);
  const failed = [];
  if (a.alive_6h < an.min_alive_6h) failed.push("alive " + a.alive_6h.toFixed(2));
  if (a.organic < an.min_organic) failed.push("organic " + a.organic.toFixed(2));
  if (a.chase > an.max_chase) failed.push("chase " + a.chase.toFixed(2));

  return { score, passed: failed.length === 0, failed };
}

// ---- Risk rules (one poll) ----
// pos: {entry, peak, stopPct, trail_active, opened_at}; returns {pos, exit:null|reason}
function riskStep(pos, price, now, rk) {
  const p = { ...pos };
  p.peak = Math.max(p.peak || p.entry, price);
  if (price <= p.entry * (1 - p.stopPct / 100)) return { pos: p, exit: "stop" };
  if (price >= p.entry * (1 + rk.trail_start_pct / 100)) p.trail_active = true;
  if (p.trail_active && price <= p.peak * (1 - rk.trail_pct / 100)) return { pos: p, exit: "trail" };
  if (now - p.opened_at >= rk.timeout_h * 3600e3 && price < p.entry * (1 + rk.timeout_min_gain_pct / 100)) return { pos: p, exit: "timeout" };
  return { pos: p, exit: null };
}

function paperClose(sizeUsd, entry, exit, refDiscount) {
  const gross = sizeUsd * exit / entry;
  const fees = round2(fomoFee(sizeUsd, refDiscount) + fomoFee(gross, refDiscount));
  const pnl = round2(gross - sizeUsd - fees);
  return { proceeds: round2(gross - fees), fees, pnl, pct: round2(100 * pnl / sizeUsd) };
}

// ---- Auditor helpers ----
// biggest connected group of holders in the RugCheck insiders graph
// returns {bundled, nodata}
function biggestBundle(graph) {
  if (!Array.isArray(graph)) return { bundled: null, nodata: true };
  const parent = {};
  const find = x => (parent[x] === x ? x : (parent[x] = find(parent[x])));
  const holders = new Set();
  for (const net of graph) {
    if (!Array.isArray(net?.links) && !Array.isArray(net?.nodes)) return { bundled: null, nodata: true };
    for (const n of net.nodes || []) if (num(n.holdings) > 0) { holders.add(n.id); parent[n.id] = n.id; }
  }
  for (const net of graph) for (const l of net.links || []) {
    if (holders.has(l.source) && holders.has(l.target)) {
      const a = find(l.source), b = find(l.target); if (a !== b) parent[a] = b;
    }
  }
  const sizes = {};
  for (const h of holders) { const r = find(h); sizes[r] = (sizes[r] || 0) + 1; }
  const vals = Object.values(sizes);
  const big = vals.length ? Math.max(...vals) : 0;
  return { bundled: big > 1 ? big : 0, nodata: false };
}
function normName(s) { return String(s || "").toLowerCase().replace(/[\s\d]/g, "").replace(/[^\p{L}]/gu, ""); }

    for (const x of a) for (const y of b) {

}

}
// simple rate limiter: n per second
function limiter(perSec) {

  return () => new Promise(res => { if (tokens > 0) { tokens--; res(); } else q.push(res); });
}

// DexScreener: one batch per writer, chunks of 30, under 250/min
let dexCalls = [], dexBackoffUntil = 0;
async function dexBatch(mints) {

  for (let i = 0; i < mints.length; i += 30) {
    dexCalls = dexCalls.filter(t => t > Date.now() - 60e3);
    if (dexCalls.length >= 250) await sleep(1000);
    dexCalls.push(Date.now());
    try {
      const arr = await httpJSON("https://api.dexscreener.com/tokens/v1/solana/" + mints.slice(i, i + 30).join(","));
      for (const p of Array.isArray(arr) ? arr : []) { const m = p?.baseToken?.address; if (m) (out[m] = out[m] || []).push(p); }
    } catch (e) { if (e.code === 429) { dexBackoffUntil = Date.now() + 30e3; } throw e; }
  }

}

  const c = DB.coins[mint]; if (!c || c.status !== "passed") return;
  if (!S().auditor.enabled) { c.status = "audited"; c.audit = { passed: true, skipped: true, layers: [], ts: Date.now() }; analystQueue.push(mint); return; }

// full 8-layer audit; toDesk=false for "buy X" commands on coins never pushed
async function runAudit(c, toDesk) {
  const au = S().auditor, mint = c.mint;
  c.audit = { running: true, layers: [], passed: false, reason: null, ts: Date.now(), holders: null };
  emit("audit_start", { mint });
  let rep = null, graph = undefined, acct = null, supply = null, decimals = 0, bundled = null, delegMax = null;
  const getRep = async () => rep || (rep = await withRetry(() => rugcheck(mint, "/report", true), au.retries));
  const getAcct = async () => acct || (acct = await withRetry(() => rpc("getAccountInfo", [mint, { encoding: "jsonParsed" }]), au.retries));
  const L = async (n, fn) => {
    const t0 = performance.now(); let res;
    try { res = await fn(); } catch (e) { res = { pass: false, value: "no data: " + ["mint", "freeze", "dev", "holders", "liquidity", "age", "bundles", "delegations"][n - 1], err: e.message }; }
    const layer = { n, name: LAYER_NAMES[n - 1], pass: !!res.pass, value: res.value, source: res.source || "rpc", ms: Math.round(performance.now() - t0) };
    c.audit.layers.push(layer); emit("audit_layer", { mint, layer }); logLine("auditor", { mint, ...layer, err: res.err });
    return layer.pass;
  };
  const layers = [
    () => L(1, async () => { const info = (await getAcct())?.value?.data?.parsed?.info; if (!info) throw new Error("no account");
      supply = num(info.supply); decimals = info.decimals; return info.mintAuthority == null ? { pass: true, value: "Revoked" } : { pass: false, value: "mint not revoked" }; }),
    () => L(2, async () => { const info = (await getAcct())?.value?.data?.parsed?.info; if (!info) throw new Error("no account");
      return info.freezeAuthority == null ? { pass: true, value: "Revoked" } : { pass: false, value: "freeze not revoked" }; }),
    () => L(3, async () => {
      if (!supply) return { pass: false, value: "no supply" };
      if (!c.creator) { try { c.creator = (await getRep())?.creator || null; } catch {} }
      if (!c.creator) return { pass: false, value: "no data: dev" };
      const bal = await withRetry(() => creatorBalance(c.creator, mint), au.retries);
      if (c.creatorBalAtMig == null) c.creatorBalAtMig = bal;  // first sight of the dev wallet
      const pct = 100 * bal / supply;
      if (bal < c.creatorBalAtMig) return { pass: false, value: "dev sold" };
      if (pct >= au.max_dev_pct) return { pass: false, value: "dev holds " + Math.round(pct) + "%" };
      c.devPct = round2(pct); return { pass: true, value: fmt1(pct) + "% · sold 0" };
    }),
    () => L(4, async () => { const t = await withRetry(() => top10Pct(mint, new Set([c.pool, c.pair].filter(Boolean))), au.retries);
      c.top10 = round2(t.pct); c.largestCount = t.count;
      return t.pct < au.max_top10_pct ? { pass: true, value: fmt1(t.pct) + "%" } : { pass: false, value: "top 10 hold " + Math.round(t.pct) + "%" }; }),
    () => L(5, async () => { const r = await getRep();
      const mk = (r?.markets || []).find(m => m.pubkey === c.pool || m.pubkey === c.pair);
      const pct = mk?.lp?.lpLockedPct;
      if (!mk || pct == null) return { pass: false, value: "no data: liquidity", source: "rugcheck" };
      const liqNow = c.lastDex?.liq ?? null;
      if (liqNow != null && c.liqAtScan && liqNow < c.liqAtScan * 0.5) return { pass: false, value: "liquidity pulled", source: "rugcheck" };
      c.lp = Math.round(num(pct));
      return num(pct) >= au.min_lp_locked_pct ? { pass: true, value: Math.round(num(pct)) + "% locked", source: "rugcheck" } : { pass: false, value: "liquidity unlocked", source: "rugcheck" }; }),
    () => L(6, async () => { const m = Math.floor((Date.now() - c.migratedAt) / 60e3);
      return m >= au.min_pool_age_min ? { pass: true, value: m >= 60 ? Math.floor(m / 60) + "h " + (m % 60) + "m" : m + "m" } : { pass: false, value: "pool too young" }; }),
    () => L(7, async () => { graph = await withRetry(() => rugcheck(mint, "/insiders/graph", true), au.retries);
      const b = biggestBundle(graph); if (b.nodata) return { pass: false, value: "no data: bundles", source: "rugcheck" };
      bundled = b.bundled;
      return b.bundled < au.max_bundled ? { pass: true, value: b.bundled ? b.bundled + " linked" : "None", source: "rugcheck" } : { pass: false, value: b.bundled + " bundled wallets", source: "rugcheck" }; }),
    () => L(8, async () => {
      // getProgramAccounts returns nothing for Token-2022 on Helius (proved 6 Nov), so: Helius getTokenAccounts + getMultipleAccounts
      let page = 1, all = [];
      while (page <= 20) {
        await rpcGate();
        const j = await withRetry(() => httpJSON(rpcUrl(), { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "getTokenAccounts", params: { mint, limit: 1000, page } }) }, 45000), au.retries);
        if (j.error) throw new Error(j.error.message);
        const ta = j.result?.token_accounts || []; all = all.concat(ta);
        if (ta.length < 1000) break; page++;
      }
      const holders = all.filter(a => num(a.amount) > 0).length;
      if (!holders && (c.largestCount || 0) > 0) throw new Error("0 accounts but holders exist");
      c.holders = holders; c.audit.holders = holders;
      const deleg = all.filter(a => num(a.delegated_amount) > 0).map(a => a.address);
      const by = {};
      for (let i = 0; i < deleg.length; i += 100) {
        const r = await rpc("getMultipleAccounts", [deleg.slice(i, i + 100), { encoding: "jsonParsed" }]);
        for (const v of r?.value || []) { const d = v?.data?.parsed?.info?.delegate; if (d) by[d] = (by[d] || 0) + 1; }
      }
      const top = Object.entries(by).sort((a, b) => b[1] - a[1])[0];
      delegMax = top ? top[1] : 0;
      if (top && top[1] >= au.max_delegated_accounts) return { pass: false, value: top[1] + " wallets → " + shortAddr(top[0]) };
      return { pass: true, value: top ? top[1] + " delegated" : "None" };
    }),
  ];
  let passed = true;
  for (let i = 0; i < 8; i++) {
    const ok = await layers[i]();
    if (!ok) { passed = false;
      for (let k = i + 2; k <= 8; k++) { const layer = { n: k, name: LAYER_NAMES[k - 1], pass: null, value: "not checked", source: "-" }; c.audit.layers.push(layer); emit("audit_layer", { mint, layer }); }
      break; }
  }
  const failedLayer = c.audit.layers.find(l => l.pass === false);
  c.audit.running = false; c.audit.passed = passed; c.audit.reason = failedLayer ? failedLayer.value : null;
  c.audit.bundled = bundled; c.audit.delegMax = delegMax;
  if (failedLayer && failedLayer.n === 8 && /^no data/.test(failedLayer.value)) {
    c.audit.layer8Down = true;
    if (!runAudit.l8Warned) { runAudit.l8Warned = true; push("layer 8 down, every coin is red until rpc_url changes", null, null); }
  }
  const out = { agent: "auditor", mint, ts: new Date().toISOString(), passed, layersChecked: c.audit.layers.filter(l => l.pass !== null).length, layers: c.audit.layers, holders: c.holders, reason: c.audit.reason };
  logLine("auditor", { mint, verdict: passed });
  emit("audit_done", out);
  if (!toDesk) return out;
  DB.counts.audited++;
  if (passed) { c.status = "audited"; decision("auditor", mint, "pass", "8/8 → Executor"); analystQueue.push(mint); }
  else {
    c.status = "rejected"; c.reason = c.audit.reason; DB.counts.rejected++;
    decision("auditor", mint, "reject", c.audit.reason);
    addActivity("rejected", mint, "Auditor", "Rejected " + coinName(mint), "Auditor · " + c.audit.reason, "Skipped");
    if (S().desk.push_rejects) push("Rejected " + coinName(mint) + " · " + c.audit.reason, mint, "Open on FOMO");
  }
  saveDB(); return out;
}

  c.priceAtAnalyst = num(pair.priceUsd); DB.counts.scored++;
  logLine("analyst", { mint, ...answers, score: g.score, verdict: g.passed, inputTokens });
  emit("verdict", { mint, ...c.verdict });
  if (g.passed) { c.status = "scored"; decision("analyst", mint, "pass", "score " + g.score); executorQueue.push(mint); }
  else analystReject(c, g.failed[0], g.score);

}
function analystState(c, p) {
  const age = Math.floor((Date.now() - c.migratedAt) / 60e3);
  return (`Coin ${c.name || c.symbol || "unknown"} on Solana, graduated ${age} min ago. Liquidity $${Math.round(num(p?.liquidity?.usd))}. Market cap $${Math.round(num(p?.marketCap))}. ` +
    `Last 5 min: ${num(p?.txns?.m5?.buys)} buys, ${num(p?.txns?.m5?.sells)} sells, volume $${Math.round(num(p?.volume?.m5))}, price ${num(p?.priceChange?.m5)}%. ` +
    `Last 1h: ${num(p?.txns?.h1?.buys)} buys, ${num(p?.txns?.h1?.sells)} sells, volume $${Math.round(num(p?.volume?.h1))}, price ${num(p?.priceChange?.h1)}%. ` +
    `Top 10 hold ${c.top10 ?? "?"}%. Dev holds ${c.devPct ?? "?"}%, sold 0. LP ${c.lp ?? "?"}% locked. Bundled ${c.audit?.bundled ?? 0}. Delegations ${c.audit?.delegMax ?? 0}.`).slice(0, 3000);
}
function analystReject(c, rule, score) {

  const who = S().analyst.mode === "rules" ? "Analyst (rules)" : "Analyst";
  decision("analyst", c.mint, "reject", rule);
  addActivity("rejected", c.mint, who, "Rejected " + coinName(c.mint), who + " · " + rule, "Skipped");

}

// ================= AGENT 4 · EXECUTOR =================
const executorQueue = [];
function paperBalance() {
  let v = DB.cash;
  for (const p of openPositions()) { const last = lastPrice(p.mint) || p.entry; v += p.size * last / p.entry; }
  return round2(v);
}
function lastPrice(mint) { const a = DB.prices[mint]; return a && a.length ? a[a.length - 1][1] : null; }
async function executorTick() {
  const mint = executorQueue.shift(); if (!mint) return;
  const c = DB.coins[mint]; if (!c || c.status !== "scored" || c.signal) return;   // 1 push per coin per night
  if (DB.skips[mint]) return;
  if (S().desk.mode !== "PAPER") return execSkip(c, "LIVE needs the PC desk");
  const ex = S().executor;
  let pair;
  try { const p = await dexBatch([mint]); pair = pickPumpswapPair(p[mint]); } catch { pair = null; }
  const price = num(pair?.priceUsd);
  if (!pair || !price) return execSkip(c, "no price");
  writePrice(mint, pair);
  const liq = num(pair?.liquidity?.usd);
  if (c.liqAtScan && liq < c.liqAtScan * (1 - ex.recheck_liq_drop_pct / 100)) return execSkip(c, "liquidity dropping");
  if (c.priceAtAnalyst && price > c.priceAtAnalyst * (1 + ex.recheck_price_up_pct / 100)) return execSkip(c, "ran before the push");
  const stack = paperBalance();
  const openUsd = openPositions().reduce((s, p) => s + p.size, 0);
  const z = sizeTicket({ stack, openUsd, poolLiqUsd: liq, ex });
  logLine("executor", { mint, stack, raw: stack * ex.stack_pct / 100, cap: z.cap, size: z.size, mode: "PAPER", status: z.skip ? "skipped" : "sent", link: coin_url(mint, "solana") });
  if (z.skip) return execSkip(c, z.skip);
  const pct = round2(100 * z.size / stack), rk = S().risk;
  c.signal = { ts: Date.now(), price, size: z.size, pct, link: coin_url(mint, "solana"), mode: "PAPER", status: "sent" };
  emit("signal", { mint, ...c.signal });
  push(`Buy ${coinName(mint)} · ${fmtUsd(z.size)} · ${fmt1(pct)}% of stack\nAuditor ${S().auditor.enabled ? "8/8" : "off"} · Analyst ${c.verdict?.score ?? "?"} · stop -${rk.stop_pct}% · trail ${rk.trail_pct}%`, mint, "Buy on FOMO", { kind: "buy" });
  // PAPER: fill at the signal price at once
  const pos = { id: nextId(), mint, name: coinName(mint), opened_at: Date.now(), entry: price, size: z.size, peak: price, stopPct: rk.stop_pct, trail_active: false, mode: "PAPER", noPrice: 0 };
  DB.positions.push(pos); DB.cash = round2(DB.cash - z.size); DB.counts.trades++;
  c.signal.status = "bought"; c.status = "open";
  decision("executor", mint, "bought", fmtUsd(z.size) + " · " + fmt1(pct) + "%");
  addActivity("bought", mint, "Executor", "Bought " + coinName(mint), "Executor · " + timeStr(Date.now()), fmtUsd(z.size) + " · " + fmt1(pct) + "% of stack");
  emit("fill", { mint, pos }); saveDB();
}
function execSkip(c, reason) {

  decision("executor", c.mint, "skip", reason);

}
const timeStr = t => new Date(t).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });

// ================= AGENT 5 · RISK =================
async function riskPoll() {
  const open = openPositions(); if (!open.length) return;
  let pairs;
  try { pairs = await dexBatch([...new Set(open.map(p => p.mint))]); }
  catch (e) { for (const p of open) noPriceTick(p); logLine("risk", { missedPoll: e.message }); return; }
  const rk = S().risk, now = Date.now();
  for (const p of open) {
    const pair = pickPumpswapPair(pairs[p.mint]);
    const price = num(pair?.priceUsd);
    if (!pair || !price) { noPriceTick(p); continue; }
    p.noPrice = 0; writePrice(p.mint, pair);
    if (num(pair?.liquidity?.usd) <= 0) { closePosition(p, price, "pulled"); continue; }
    const r = riskStep({ entry: p.entry, peak: p.peak, stopPct: p.stopPct, trail_active: p.trail_active, opened_at: p.opened_at }, price, now, rk);
    p.peak = r.pos.peak; p.trail_active = r.pos.trail_active;
    logLine("risk", { mint: p.mint, price, peak: p.peak, stop: p.entry * (1 - p.stopPct / 100), trail: p.trail_active ? p.peak * (1 - rk.trail_pct / 100) : null, action: r.exit || "hold" });
    if (r.exit) closePosition(p, price, r.exit);
  }
  emit("risk", {}); saveDB();
}
function noPriceTick(p) {
  p.noPrice = (p.noPrice || 0) + 1;
  if (p.noPrice === 4) push(`${p.name}: no price for 1 min`, p.mint, "Sell on FOMO", { kind: "sell" });
}
function closePosition(p, price, reason) {
  const pc = paperClose(p.size, p.entry, price, S().desk.fees_ref_discount);
  Object.assign(p, { closed_at: Date.now(), exit: price, exit_reason: reason, pnl: pc.pnl, fees: pc.fees, pct: pc.pct });
  DB.cash = round2(DB.cash + pc.proceeds); DB.counts.exits++;
  const c = DB.coins[p.mint]; if (c) c.status = "closed";
  const rk = S().risk;
  if (reason === "trail") { push(`Sold ${p.name} · ${signUsd(pc.pnl)} (${signPct(pc.pct)})`, p.mint, "Sell on FOMO", { kind: "sell" });
    addActivity("sold", p.mint, "Risk", "Sold " + p.name, "Risk · trailing stop", signUsd(pc.pnl) + " · " + signPct(pc.pct)); }
  else if (reason === "stop") { push(`${p.name} hit the -${p.stopPct}% stop · ${fmtUsd(-Math.abs(pc.pnl))}`, p.mint, "Sell on FOMO", { kind: "sell" });
    addActivity("stopped", p.mint, "Risk", "Stopped " + p.name, "Risk · -" + p.stopPct + "% stop", fmtUsd(pc.pnl)); }
  else if (reason === "timeout") { push(`Sell ${p.name}, dead money · ${signPct(pc.pct)} in ${rk.timeout_h}h`, p.mint, "Sell on FOMO", { kind: "sell" });
    addActivity(pc.pnl >= 0 ? "sold" : "stopped", p.mint, "Risk", "Sold " + p.name, "Risk · timeout", signUsd(pc.pnl) + " · " + signPct(pc.pct)); }
  else { push(`${p.name} liquidity pulled · ${signUsd(pc.pnl)}`, p.mint, "Sell on FOMO", { kind: "sell" });
    addActivity("stopped", p.mint, "Risk", "Stopped " + p.name, "Risk · liquidity pulled", fmtUsd(pc.pnl)); }
  decision("risk", p.mint, reason, signUsd(pc.pnl));
  const out = { agent: "risk", mint: p.mint, name: p.name, ts: new Date().toISOString(), reason, entryPrice: p.entry, exitPrice: price, peakPrice: p.peak, pnlUsd: pc.pnl, pct: pc.pct, feesUsd: pc.fees, stopPct: p.stopPct, mode: "PAPER", status: "closed", link: coin_url(p.mint, "solana") };
  logLine("risk", out); emit("exit", out); saveDB();
}

    jevTokens: coins.reduce((s, c) => s + num(c.verdict?.inputTokens), 0),

}

    r.layer8Killed ? el("div", { class: "errorrow", text: `Layer 8 was down: ${r.layer8Killed} coins turned red for it` }) : null,
    el("div", { class: "card" }, el("div", { class: "kv" }, el("span", { text: "Night" }), el("span", { text: new Date(r.from).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" }) + " · " + r.hours + "h" })),
      el("div", { class: "kv" }, el("span", { text: "Balance" }), el("span", { text: fmtUsd(r.startBalance) + " → " + fmtUsd(r.endBalance) })),
      el("div", { class: "kv" }, el("span", { text: "Coins seen" }), el("span", { text: String(r.seen) })),
      el("div", { class: "kv" }, el("span", { text: "Fees paid" }), el("span", { text: fmtUsd(r.fees) })),
      el("div", { class: "kv" }, el("span", { text: "Jev tokens" }), el("span", { text: r.jevTokens ? r.jevTokens + " · $" + (r.jevTokens * 0.042 / 1e6).toFixed(4) : "0 · rules mode" }))),
    ...sec("Red trades", r.red.map(posRow)), ...sec("Green trades", r.green.map(posRow)),
    ...sec("Scanner kills", Object.entries(r.kills).map(([k, n]) => el("div", { class: "li" }, el("span", { class: "grow", text: k }), el("span", { class: "v", text: String(n) })))),
    ...sec("Auditor refusals", Object.entries(r.refusals).flatMap(([layer, arr]) => arr.map(x => el("a", { class: "li", href: coin_url(x.mint, "solana"), target: "_blank", rel: "noopener" }, el("span", { class: "grow" }, el("div", { class: "t", text: x.name }), el("div", { class: "s", text: layer + " · " + x.value })), el("span", { class: "v sec", text: timeStr(x.ts) }))))),
    ...sec("Analyst rejects", r.analystRej.map(x => el("a", { class: "li", href: coin_url(x.mint, "solana"), target: "_blank", rel: "noopener" }, el("span", { class: "grow", text: x.name }), el("span", { class: "v sec", text: x.rule || "" })))),
    el("p", { class: "sec" }, "New to FOMO? ", el("a", { class: "blue", href: SIGNUP_URL, target: "_blank", rel: "noopener", text: SIGNUP_URL })),
  ];
  s.replaceChildren(...kids.filter(Boolean));
}

// ---------- toasts ----------
function toast(p) {
  const box = $("#toasts"); if (!box) return;
  const t = el("div", { class: "toast", role: "status" }, el("div", { class: "hd" }, el("span", { text: "Grok Bot · now" }), el("button", { "aria-label": "Dismiss", text: "✕", onclick: () => t.remove(), style: "min-width:28px" })),
    el("div", { class: "tx", text: p.text }),
    p.link ? el("div", { class: "acts" }, el("a", { class: p.kind === "sell" ? "sell" : "buy", href: p.link, target: "_blank", rel: "noopener", text: p.button || "Open on FOMO" }), el("button", { text: "Coin", onclick: () => { t.remove(); openCoin(p.mint); } })) : null);
  box.prepend(t); setTimeout(() => t.remove(), p.link ? 12000 : 6000);
  while (box.children.length > 3) box.lastChild.remove();
}

// ---------- commands (STEP 9) ----------
function findCoins(x) {
  const q = x.trim().toLowerCase(); if (!q) return [];
  const exact = Object.values(DB.coins).filter(c => c.mint.toLowerCase() === q || (c.symbol || "").toLowerCase() === q || (c.name || "").toLowerCase() === q);
  return exact.length ? exact : Object.values(DB.coins).filter(c => (c.name || "").toLowerCase().includes(q) || (c.symbol || "").toLowerCase().includes(q));
}
function coinLink(c) { return el("a", { href: coin_url(c.mint, "solana"), target: "_blank", rel: "noopener", text: (c.name || shortAddr(c.mint)) }); }
function runCommand(raw) {
  const t = raw.trim().replace(/^\//, ""), lo = t.toLowerCase(), out = [];
  const line = (...k) => out.push(el("div", {}, ...k));
  const one = (x, fn) => {
    const hits = findCoins(x);
    if (!hits.length) { if (x.trim().length > 30) return fn({ mint: x.trim(), name: shortAddr(x.trim()) }); line("I don't know " + x + " tonight. Send me its mint."); return; }
    if (hits.length > 1) { line("Which one?"); for (const c of hits.slice(0, 8)) line("· ", coinLink(c), " " + (c.symbol || "")); return; }
    fn(hits[0]);
  };
  let m;
  if (!lo) return [el("div", { text: "Type a command." })];
  if ((m = lo.match(/^buy (.+)/))) one(t.slice(4), c => {
    const p = DB.pushes.find(x => x.mint === c.mint && x.kind === "buy");
    if (p) { line(p.text); line(el("a", { href: p.link, target: "_blank", rel: "noopener", text: "[Buy on FOMO]" })); return; }
    line("Taking apart " + (c.name || shortAddr(c.mint)) + "…");
    const coin = DB.coins[c.mint] || (DB.coins[c.mint] = { mint: c.mint, migratedAt: Date.now(), seenAt: Date.now(), status: "manual" });
    runAudit(coin, false).then(r => { const o = $("#cmdout"); if (!o) return; o.replaceChildren(...r.layers.map(l => el("div", { text: `${l.n} ${l.name}: ${l.value}` })), el("div", { text: "not sized, not on the desk" }), el("a", { href: coin_url(c.mint, "solana"), target: "_blank", rel: "noopener", text: "[Buy on FOMO]" })); });
  });
  else if ((m = lo.match(/^sell (.+)/))) one(t.slice(5), c => { const p = openPositions().find(x => x.mint === c.mint); if (!p) line("No open position in " + (c.name || c.mint)); else line(el("a", { href: coin_url(c.mint, "solana"), target: "_blank", rel: "noopener", text: "[Sell on FOMO] " + p.name })); });
  else if ((m = lo.match(/^why (.+)/))) one(t.slice(4), c0 => { const c = DB.coins[c0.mint]; if (!c) return line("Never seen it.");
    const who = c.status === "killed" ? "Scanner" : c.audit && !c.audit.passed ? "Auditor · layer " + (c.audit.layers.find(l => l.pass === false)?.n) : c.verdict && !c.verdict.passed ? "Analyst" : c.signal?.status === "skipped" ? "Executor" : null;
    line(coinLink(c), " · " + (who ? who + " · " + (c.reason || "") : "not stopped · " + c.status), " · " + timeStr(c.audit?.ts || c.verdict?.ts || c.seenAt)); });
  else if ((m = lo.match(/^(pause|resume) (\w+)/))) { const a = m[2]; if (!AGENTS.includes(a)) line("Agents: " + AGENTS.join(", ")); else { const r = setPaused(a, m[1] === "pause"); line(r.ok ? NAMES[a] + (m[1] === "pause" ? " paused" : " running") : r.error); } }
  else if ((m = lo.match(/^set ([\w.]+) to (-?[\d.]+|\w+)%?$/))) {
    let path = SETTING_ALIASES[m[1]] || m[1]; if (!path.includes(".")) { const g = Object.keys(SETTINGS_SPEC).find(g => m[1] in SETTINGS_SPEC[g]); path = g ? g + "." + m[1] : path; }
    const [g, k] = path.split("."); let val = m[2]; if (/^-?[\d.]+$/.test(val)) val = String(Math.abs(Number(val)));
    const r = setSetting(g, k, val, "command"); line(r.ok ? `${m[1]} ${fmtSet(g, k, r.old)} -> ${fmtSet(g, k, r.value)}` : "Refused · " + r.error);
  }
  else if (lo === "status") { line(S().desk.mode + " · balance " + fmtUsd(paperBalance())); const op = openPositions(); if (!op.length) line("No open positions"); for (const p of op) line(p.name + " · " + fmtUsd(p.size) + " ", el("a", { href: coin_url(p.mint, "solana"), target: "_blank", rel: "noopener", text: "[Sell on FOMO]" })); }
  else if (lo === "paper") line("Already PAPER.");
  else if (lo === "live") line("LIVE needs the PC desk and a full PAPER night.");
  else if (lo === "invite") line(el("a", { href: SIGNUP_URL, target: "_blank", rel: "noopener", text: SIGNUP_URL }));
  else if (lo === "report") { const r = DB.reports[DB.reports.length - 1]; if (r) { openReport(r); line("Opened the last report."); } else line("No report yet. End the night in Account to make one."); }
  else if ((m = lo.match(/^stack (\d+)/))) line("Stack is for LIVE, which runs on the PC desk.");
  else line("Commands: buy X · sell X · why X · pause Scanner · set stop to -8% · stack 1240 · status · paper | live · invite · report");
  return out;
}
function fmtSet(g, k, v) { return (g === "risk" && k === "stop_pct") ? "-" + v + "%" : String(v); }

// ---------- render loop ----------
function render() {
  if (tab === "home") renderHome(); else if (tab === "agents") renderAgents(); else if (tab === "activity") renderActivity(); else renderAccount();
  renderSheet();
}
let renderQueued = false;
function queueRender() { if (renderQueued) return; renderQueued = true; setTimeout(() => { renderQueued = false; if (tab === "account" && document.activeElement?.tagName === "INPUT") { renderSheet(); return; } render(); }, 400); }

function boot() {
  buildShell();
  // loading state: blocks in the final layout
  $("#home").append(el("div", { class: "skel", style: "height:52px" }), el("div", { class: "skel", style: "height:90px;margin-top:16px" }), el("div", { class: "skel", style: "height:220px;margin-top:16px" }));
  startDesk();
  onDesk((type, data) => {
    if (type === "push") toast(data);
    if (type === "audit_layer" && sheetKind === "audit" && sheetMint === data.mint) { renderSheet(); return; }
    if (type === "audit_start") beamState[data.mint] = 0;
    queueRender();
  });
  render();
  setInterval(() => { if (tab === "home" || sheetKind === "coin") queueRender(); }, 15e3);
  window.addEventListener("resize", queueRender);
}
document.addEventListener("DOMContentLoaded", boot);

</script>
